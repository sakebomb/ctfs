stages:
  - test
  - deploy

variables:
  # This is a base64 encoded secret that should never be exposed
  SECRET_COUPON: "ZmxhZ3tBbGxXb3JrQW5kTm9QbGF5TWFrZXNOdXR0eUFkdWxsYm9pLXV3dX0="

test:
  stage: test
  script:
